<!DOCTYPE html>
<html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>哈利波特：霍格華茲巔峰魔咒決鬥</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>哈利波特：魔咒決鬥</h1><p>搶四勝賽制 · 光束特效 · 索命咒反噬</p></header>
<main><section class="duel-stage"><canvas id="fx-canvas" aria-hidden="true"></canvas><div class="duel-side" id="team1"></div><div class="duel-side" id="team2"></div></section><div id="battle-log" role="log" aria-label="對戰紀錄"></div><section class="controls-panel"><div class="action-header"><strong id="turn-indicator">請選擇模式</strong><span id="round-number"></span><button id="change-mode">切換模式</button></div><div id="spells"></div><div id="target-selector" hidden><p>選擇魔咒施放目標：</p><div id="target-buttons"></div></div><button id="submit-turn-btn" disabled>請先選擇魔咒</button><details><summary>遊戲規則與魔咒說明</summary><p>所有角色先選指令，再一起結算。先防禦、復原及繳械，再按角色順序施放攻擊。同回合的防禦可擋多次攻擊。昏迷會跳過下一次行動，隊友可用復原咒解除；自己昏迷時不能自救。倒下角色不能施法或被治療。</p><p>索命咒命中即贏本局；荒唐咒可擋索命咒，並反噬施法者 40 HP。使用後須等完整 5 回合才能再次使用，每局重設。先取得 4 勝為冠軍。這是非官方學生遊戲，魔咒效果為遊戲自訂。</p></details></section></main>
<div id="mode-modal" class="modal-overlay"><section class="mode-card" role="dialog" aria-modal="true" aria-labelledby="mode-title"><h2 id="mode-title">⚔️ 霍格華茲決鬥對決</h2><p id="result"></p><button data-mode="1v1">⚔️ 1對1 人機決鬥<small>玩家 vs 電腦</small></button><button data-mode="2v2">🛡️ 2對2 團隊聯盟賽<small>與 AI 盟友並肩作戰</small></button></section></div>
<script src="game.js"></script></body></html>
